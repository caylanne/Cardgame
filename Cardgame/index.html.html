<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missão Memória — Jogo da Memória</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --bg: #26cfd5;
    --bg-panel: #fbfaf9;
    --card-back: #fefefe;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100%;
    background:
      var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 48px;
  }
 
  header{
    text-align:center;
    max-width:600px;
    margin-bottom:24px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--gold);}
  header p{
    color:var(--ink-dim);
    margin:0;
    font-size:0.95rem;
  }
 
  .painel{
    color: #000000;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    background:var(--bg-panel);
    border:1px solid rgba(85, 119, 228, 0.979);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:26px;
    width:100%;
    max-width:520px;
  }
  .stat{
    flex:1;
    min-width:90px;
    text-align:center;
  }
  .stat .valor{
    font-family:'Fraunces', serif;
    font-size:1.5rem;
    font-weight:700;
    color:var(--gold);
    display:block;
  }
  .stat .rotulo{
    font-size:0.72rem;
    color:var(--ink-dim);
  }
  #btn-reiniciar{
    background:var(--pink);
    color:#000000;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease;
    align-self:center;
  }
  #btn-reiniciar:hover{ transform: translateY(-1px); background:#f92323; }
  #btn-reiniciar:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
 
  #btn-continuar{
    background:var(--gold);
    color:#0e0e0f;
    border:none;
    border-radius:10px;
    padding:10px 22px;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    margin-bottom:20px;
  }
  #btn-continuar.oculto{ display:none; }
  #btn-continuar:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; }
 
  main{ width:100%; max-width:520px; }

 
  .carta{
    border-radius: 15px;
    background-color: rgba(73, 79, 100, 0.979);
    aspect-ratio:3/4;
    perspective:800px;
    cursor:pointer;
  }
  .carta-interna{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
    border-radius:12px;
  }
  .carta.virada .carta-interna{ transform:rotateY(180deg); }
  .carta.errada .carta-interna{ animation: tremer 0.4s ease; }
  @keyframes tremer{
    20%{ transform: rotateY(180deg) translateX(-4px); }
    40%{ transform: rotateY(180deg) translateX(4px); }
    60%{ transform: rotateY(180deg) translateX(-3px); }
    80%{ transform: rotateY(180deg) translateX(3px); }
    100%{ transform: rotateY(180deg) translateX(0); }
  }
 
  .face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    backface-visibility:hidden;
    font-size:clamp(1.6rem, 6vw, 2.2rem);
  }
  .verso{
    border:1px solid rgb(0, 0, 0);
  }
  .frente{
    background:var(--bg-panel);
    border:1px solid var(--gold);
    transform:rotateY(180deg);
  }
  .carta.combinada .frente{
    border-color:var(--ok);
    box-shadow:0 0 0 2px rgba(79, 92, 209, 0.25);
  }
  .carta.combinada{ cursor:default; }
 
  .modal-caixa{
    background:var(--bg-panel);
    border:1px solid rgba(0, 247, 255, 0.693);
    border-radius:16px;
    padding:32px 28px;
    max-width:340px;
    width:100%;
    text-align:center;
  }
  .modal-caixa h2{
    font-family:'Fraunces', serif;
    color:var(--gold);
    margin:0 0 8px;
  }
  .modal-caixa p{ color:var(--ink-dim); margin:4px 0 20px; font-size:0.9rem; }
  .modal-resultados{
    display:flex;
    justify-content:space-around;
    margin-bottom:22px;
  }
  .modal-resultados div span{
    display:block;
    font-size:1.3rem;
    font-weight:700;
    color:var(--ink);
  }
  .modal-resultados div small{ color:var(--ink-dim); font-size:0.7rem; }
 
  footer{
    margin-top:28px;
    color:var(--ink-dim);
    font-size:0.78rem;
    text-align:center;
  }
 
  @media (max-width:380px){
    #tabuleiro{ gap:7px; }
  }
</style>
</head>
<body>
 
<header>
  <h1>Missão <span>Memória</span></h1>
</header>

<section class="painel container-fluid" aria-label="Status da partida">
  <div class="row row-cols-2 row-cols-sm-4 g-2 align-items-center text-center">
    <div class="col stat"><span class="valor" id="pontos">0</span><span class="rotulo">Pontos</span></div>
    <div class="col stat"><span class="valor" id="jogadas">0</span><span class="rotulo">Jogadas</span></div>
    <div class="col stat"><span class="valor" id="tempo">00:00</span><span class="rotulo">Tempo</span></div>
    <div class="col d-flex justify-content-center">
      <button id="btn-reiniciar" class="btn" type="button">Reiniciar</button>
    </div>
  </div>
</section>
 
<button id="btn-continuar" class="oculto" type="button">Continuar</button>
 
<main class="container" style="max-width:520px;">
  <div id="tabuleiro" class="row row-cols-3 row-cols-sm-4 g-2" role="grid" aria-label="Tabuleiro do jogo da memória"></div>
</main>
 
<div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-caixa">
      <div class="modal-body text-center">
        <h2 id="modal-titulo">Missão cumprida!</h2>
        <p>Você encontrou todos os pares.</p>
        <div class="modal-resultados row row-cols-3 text-center">
          <div class="col"><span id="final-tempo">00:00</span><small>TEMPO</small></div>
          <div class="col"><span id="final-jogadas">0</span><small>JOGADAS</small></div>
          <div class="col"><span id="final-pontos">0</span><small>PONTOS</small></div>
        </div>
        <button id="btn-jogar-de-novo" class="btn" type="button">Jogar novamente</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
<script>
  const SIMBOLOS = ['🪐','🚀','🌙','⭐','☄️','🛰️','🔭','🌌'];
 
  let cartasViradas = [];
  let paresEncontrados = 0;
  let jogadas = 0;
  let pontos = 0;
  let tabuleiroTravado = false;
  let horaInicio = null; 
  let jogoComecou = false;
  let aguardandoContinuar = false;
  let cartasCombinadas = [];
  let idCronometro = null; 
  const elTabuleiro = document.getElementById('tabuleiro');
  const elPontos = document.getElementById('pontos');
  const elJogadas = document.getElementById('jogadas');
  const elTempo = document.getElementById('tempo');
  const elModal = document.getElementById('modal');
  const modalVitoria = new bootstrap.Modal(elModal);
  const elBtnContinuar = document.getElementById('btn-continuar');

  function embaralhar(lista) {
    const copia = [...lista];
    const resultado = [];
 
    while (copia.length > 0) {
      const indiceSorteado = Math.floor(Math.random() * copia.length);
      const ultimoIndice = copia.length - 1;
 
      const temporario = copia[indiceSorteado];
      copia[indiceSorteado] = copia[ultimoIndice];
      copia[ultimoIndice] = temporario;
 
      resultado.push(copia.pop());
    }
 
    return resultado;
  }
 
  function criarTabuleiro() {
    elTabuleiro.innerHTML = '';
 
    const baralho = embaralhar([...SIMBOLOS, ...SIMBOLOS]);
 
    baralho.forEach((simbolo) => {
      const carta = document.createElement('div');
      carta.className = 'carta';
      carta.setAttribute('data-simbolo', simbolo);
 
      carta.innerHTML = `
        <div class="carta-interna">
          <div class="face verso"></div>
          <div class="face frente">${simbolo}</div>
        </div>
      `;

      carta.addEventListener('click', () => virarCarta(carta))

      const coluna = document.createElement('div');
      coluna.className = 'col';
      coluna.appendChild(carta);
      elTabuleiro.appendChild(coluna);
    });
  }
 
  function virarCarta(carta) {
    const jaVirada = cartasViradas.includes(carta);
    const jaCombinada = cartasCombinadas.includes(carta);
 
    if (tabuleiroTravado || aguardandoContinuar || jaVirada || jaCombinada || cartasViradas.length === 2) return;
 
    if (!jogoComecou) {
      jogoComecou = true;
      horaInicio = horaAtualEmSegundos();
      iniciarCronometro();
    }
 
    carta.classList.add('virada');
    cartasViradas.push(carta);
 
    if (cartasViradas.length === 2) {
      jogadas++;
      elJogadas.textContent = jogadas;
      compararCartas();
    }
  }
 
  function compararCartas() {
    tabuleiroTravado = true;
    const [primeira, segunda] = cartasViradas;
    const acertou = primeira.getAttribute('data-simbolo') === segunda.getAttribute('data-simbolo');
 
    if (acertou) {
      primeira.classList.add('combinada');
      segunda.classList.add('combinada');
      cartasCombinadas.push(primeira, segunda);
      paresEncontrados++;
      pontos += 10;
      atualizarPontos();
      cartasViradas = [];
      tabuleiroTravado = false;
 
      if (paresEncontrados === SIMBOLOS.length) {
        finalizarJogo();
      }
    } else {
      pontos = (pontos - 2 < 0) ? 0 : pontos - 2;
      atualizarPontos();
      primeira.classList.add('errada');
      segunda.classList.add('errada');
 
      aguardandoContinuar = true;
      elBtnContinuar.classList.remove('oculto');
    }
  }
 
  elBtnContinuar.addEventListener('click', () => {
    const [primeira, segunda] = cartasViradas;
    primeira.classList.remove('virada', 'errada');
    segunda.classList.remove('virada', 'errada');
    cartasViradas = [];
    tabuleiroTravado = false;
    aguardandoContinuar = false;
    elBtnContinuar.classList.add('oculto');
  });
 
  function atualizarPontos() {
    elPontos.textContent = pontos;
  }

  function horaAtualEmSegundos() {
    const agora = new Date();
    return agora.getHours() * 3600 + agora.getMinutes() * 60 + agora.getSeconds();
  }
 
  function segundosDecorridos() {
    return horaAtualEmSegundos() - horaInicio;
  }
 
  function doisDigitos(numero) {
    if (numero < 10) return '0' + numero;
    return '' + numero;
  }
 
  function formatarTempo(total) {
    const minutos = doisDigitos(Math.floor(total / 60));
    const segundos = doisDigitos(total % 60);
    return minutos + ':' + segundos;
  }
 
  function iniciarCronometro() {
    idCronometro = setInterval(() => {
      elTempo.textContent = formatarTempo(segundosDecorridos());
    }, 1000);
  }
 
  function finalizarJogo() {
    clearInterval(idCronometro);
 
    const tempoFinal = segundosDecorridos();
 
    const bonusBruto = 100 - tempoFinal - jogadas;
    const bonus = (bonusBruto < 0) ? 0 : bonusBruto;
    pontos += bonus;
    atualizarPontos();
 
    elTempo.textContent = formatarTempo(tempoFinal);
    document.getElementById('final-tempo').textContent = formatarTempo(tempoFinal);
    document.getElementById('final-jogadas').textContent = jogadas;
    document.getElementById('final-pontos').textContent = pontos;
    modalVitoria.show();
  }
 
  function reiniciarJogo() {
    clearInterval(idCronometro);
 
    cartasViradas = [];
    cartasCombinadas = [];
    paresEncontrados = 0;
    jogadas = 0;
    pontos = 0;
    horaInicio = null;
    tabuleiroTravado = false;
    jogoComecou = false;
    aguardandoContinuar = false;
 
    elJogadas.textContent = '0';
    elPontos.textContent = '0';
    elTempo.textContent = '00:00';
    modalVitoria.hide();
    elBtnContinuar.classList.add('oculto');
 
    criarTabuleiro();
  }
 
  document.getElementById('btn-reiniciar').addEventListener('click', reiniciarJogo);
  document.getElementById('btn-jogar-de-novo').addEventListener('click', reiniciarJogo);

  criarTabuleiro();
</script>
</body>
</html>
